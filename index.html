<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseMusic — Acceso y Panel</title>
  <style>
    :root {
      --bg-main: #09090b;
      --bg-card: #18181f;
      --accent: #8b5cf6;
      --accent-secondary: #06b6d4;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: grid; place-items: center; padding: 20px; }

    /* Pantalla de Login */
    .login-container {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      text-align: center;
    }
    .logo-icon {
      width: 54px; height: 54px; border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      display: grid; place-items: center; font-size: 1.6rem; margin: 0 auto 20px;
    }
    h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
    p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 32px; }
    .login-options { display: flex; flex-direction: column; gap: 14px; }
    .btn-auth {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; padding: 13px 20px; border-radius: 12px; border: 1px solid var(--border);
      background-color: #23232d; color: var(--text-main); font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .btn-auth:hover { background-color: #2f2f3d; transform: translateY(-2px); }
    .btn-google { background-color: #ffffff; color: #000000; border-color: #ffffff; }

    /* Panel de Admin (Oculto por defecto hasta iniciar sesión) */
    .admin-panel {
      display: none;
      width: 100%;
      max-width: 900px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
    }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
    .admin-badge { background: linear-gradient(135deg, var(--accent), var(--accent-secondary)); color: white; padding: 6px 14px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background-color: var(--bg-main); border: 1px solid var(--border); padding: 16px; border-radius: 14px; }
    .stat-card h3 { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    .stat-card .value { font-size: 1.5rem; font-weight: 800; }
    .profile-box { background-color: var(--bg-main); border: 1px solid var(--border); padding: 20px; border-radius: 14px; margin-top: 20px; }
    .profile-box input { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 14px; background: var(--bg-card); border: 1px solid var(--border); color: white; border-radius: 8px; }
    .btn-save { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <!-- PANTALLA DE INICIO DE SESIÓN -->
  <div id="loginScreen" class="login-container">
    <div class="logo-icon">🎵</div>
    <h1>PulseMusic</h1>
    <p>Inicia sesión para continuar</p>
    <div class="login-options">
      <button class="btn-auth btn-google" onclick="entrar('Google')">Continuar con Google</button>
      <button class="btn-auth" onclick="entrar('Gmail')">✉️ Continuar con Gmail</button>
      <button class="btn-auth" onclick="entrar('Invitado')">👤 Entrar como Invitado</button>
    </div>
  </div>

  <!-- PANEL DE ADMINISTRADOR (EXCLUSIVO JOAN) -->
  <div id="adminPanel" class="admin-panel">
    <div class="admin-header">
      <div>
        <h2>🛡️ Panel de Control Admin</h2>
        <p style="color: var(--text-muted);">Bienvenido, Joan</p>
      </div>
      <div class="admin-badge">Rol: Admin Principal</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Usuarios Totales</h3>
        <div class="value">1,248</div>
      </div>
      <div class="stat-card">
        <h3>Estado de la Web</h3>
        <div class="value" style="color: var(--success); font-size: 1.2rem;">🟢 Activa en Vercel</div>
      </div>
    </div>

    <div class="profile-box">
      <h3>👤 Perfil Personalizable (Admin)</h3>
      <label>Tu Nombre de Admin:</label>
      <input type="text" id="userName" value="Joan">
      <button class="btn-save" onclick="guardar()">Guardar Cambios</button>
    </div>

    <button class="btn-auth" style="margin-top: 20px; max-width: 200px;" onclick="cerrarSesion()">🚪 Cerrar Sesión</button>
  </div>

  <script>
    function entrar(metodo) {
      alert("¡Acceso exitoso con " + metodo + "!");
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
    }

    function guardar() {
      const nombre = document.getElementById('userName').value;
      alert("¡Perfil actualizado con éxito para " + nombre + "!");
    }

    function cerrarSesion() {
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'block';
    }
  </script>

</body>
</html>
