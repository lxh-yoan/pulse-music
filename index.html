<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseMusic — Tu App de Música</title>
  <style>
    :root {
      --bg-main: #09090b;
      --bg-sidebar: #111115;
      --bg-card: #18181f;
      --bg-card-hover: #23232d;
      --bg-player: rgba(17, 17, 21, 0.92);
      --accent: #8b5cf6;
      --accent-hover: #a78bfa;
      --accent-secondary: #06b6d4;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --danger: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Layout principal */
    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      padding: 0 8px;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      display: grid;
      place-items: center;
    }

    .nav-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      padding: 0 12px 6px;
      font-weight: 700;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s ease;
      text-align: left;
      width: 100%;
    }

    .nav-item:hover {
      color: var(--text-main);
      background-color: rgba(255, 255, 255, 0.05);
    }

    .nav-item.active {
      color: var(--text-main);
      background: linear-gradient(90deg, rgba(139, 92, 246, 0.2), transparent);
      border-left: 3px solid var(--accent);
    }
