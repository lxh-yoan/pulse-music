<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseMusic — Iniciar Sesión</title>
  <style>
    :root {
      --bg-main: #09090b;
      --bg-card: #18181f;
      --accent: #8b5cf6;
      --accent-hover: #a78bfa;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --border: #27272a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      text-align: center;
    }

    .logo-icon {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), #06b6d4);
      display: grid;
      place-items: center;
      font-size: 1.6rem;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .login-options {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn-auth {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 13px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background-color: #23232d;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-auth:hover {
      background-color: #2f2f3d;
      border-color: #52525b;
      transform: translateY(-2px);
    }

    .btn-google {
      background-color: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .btn-google:hover {
      background-color: #e4e4e7;
    }

    .divider {
      margin: 24px 0;
      height: 1px;
      background-color: var(--border);
    }

    .admin-link {
      display: inline-block;
      margin-top: 16px;
      color: var(--accent);
      font-size: 0.85rem;
      text-decoration: none;
      font-weight: 600;
    }

    .admin-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-icon">🎵</div>
    <h1>Bienvenido a PulseMusic</h1>
    <p>Inicia sesión para disfrutar de tu música sin límites</p>

    <div class="login-options">
      <!-- Opción Google -->
      <button class="btn-auth btn-google" onclick="iniciarSesion('Google')">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C9.28 19.27 6.5 16.9 6.5 12s2.78-7.27 5.72-7.27c1.45 0 2.75.5 3.79 1.45l2.05-2.05C16.59 2.5 14.43 2 12.22 2 6.58 2 2 6.58 2 12.22s4.58 10.22 10.22 10.22c5.9 0 9.8-4.15 9.8-10 0-.69-.07-1.35-.19-2.04z"/></svg>
        Continuar con Google
      </button>

      <!-- Opción Gmail (Correo/Contraseña simulado) -->
      <button class="btn-auth" onclick="iniciarSesion('Gmail')">
        ✉️ Continuar con Gmail
      </button>

      <!-- Opción Invitado -->
      <button class="btn-auth" onclick="iniciarSesion('Invitado')">
        👤 Entrar como Invitado
      </button>
    </div>

    <div class="divider"></div>

    <!-- Acceso directo simulado al panel de Admin para ti (Joan) -->
    <a href="admin.html" class="admin-link">⚡ Entrar al Panel Admin (Joan)</a>
  </div>

  <script>
    function iniciarSesion(metodo) {
      alert("¡Inicio de sesión exitoso con " + metodo + "!");
      // Aquí redirigimos a la app principal o al panel según el rol
      if(metodo === 'Google' || metodo === 'Gmail') {
        window.location.href = "admin.html"; // Redirige al panel por ahora para pruebas
      } else {
        window.location.href = "index.html";
      }
    }
  </script>

</body>
</html>
